<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>jane</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23ffcfe3'/><stop offset='1' stop-color='%23a58cff'/></linearGradient></defs><circle cx='16' cy='16' r='14' fill='url(%23g)'/><circle cx='11' cy='10' r='3.5' fill='white' opacity='.8'/></svg>">
<style>
:root {
  --ink: #2d2645; --soft: #8a82a0; --bg: #fdf8f3;
  --glass: rgba(255,255,255,.55); --edge: rgba(255,255,255,.8);
  --peach: #ffd6c4; --pink: #ffcfe3; --lilac: #ddd0ff; --mint: #c8f1df; --sky: #cfe6ff; --butter: #fff2bd;
  --accent: #7b5cff;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100dvh; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

/* ---------- background: soft blobs + chrome bubbles ---------- */
.sky { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.blob { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; filter: blur(60px); opacity: .75; animation: drift 28s ease-in-out infinite alternate; }
.blob:nth-child(1) { background: var(--pink);   top: -20vmax; left: -15vmax; }
.blob:nth-child(2) { background: var(--sky);    top: -10vmax; right: -20vmax; animation-duration: 34s; }
.blob:nth-child(3) { background: var(--mint);   bottom: -25vmax; left: 10vmax; animation-duration: 40s; }
.blob:nth-child(4) { background: var(--butter); bottom: -20vmax; right: -10vmax; animation-duration: 31s; opacity: .6; }
.bubble { position: absolute; border-radius: 50%; opacity: .75; filter: blur(.6px);
  background:
    radial-gradient(circle at 30% 26%, rgba(255,255,255,.95) 0 7%, rgba(255,255,255,0) 20%),
    radial-gradient(circle at 70% 78%, rgba(255,255,255,.55) 0 4%, rgba(255,255,255,0) 14%),
    conic-gradient(from 210deg, #ffd1ea, #cfe6ff, #c8f1df, #fff2bd, #e2d4ff, #ffd1ea);
  box-shadow: inset -12px -16px 34px rgba(123,92,255,.28), inset 10px 12px 24px rgba(255,255,255,.75), 0 20px 50px -20px rgba(123,92,255,.35);
  animation: float 18s ease-in-out infinite alternate, hue 14s linear infinite; }
.bubble.b1 { width: 160px; height: 160px; top: 14%; right: 8%; }
.bubble.b2 { width: 90px;  height: 90px;  bottom: 18%; left: 6%; animation-duration: 22s, 18s; }
.bubble.b3 { width: 54px;  height: 54px;  top: 58%; right: 22%; animation-duration: 16s, 11s; filter: blur(2px); }
.bubble.b4 { width: 220px; height: 220px; bottom: -60px; right: 30%; filter: blur(14px); opacity: .45; animation-duration: 30s, 20s; }
@keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.12); } }
@keyframes float { to { transform: translate(-30px, -50px) rotate(25deg); } }
@keyframes hue { to { filter: hue-rotate(360deg) blur(.6px); } }

/* ---------- layout ---------- */
header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 14px; padding: 18px clamp(16px, 4vw, 40px);
  background: linear-gradient(var(--bg), rgba(253,248,243,0)); }
.brand { font-weight: 800; font-size: 1.6rem; letter-spacing: -.04em; color: var(--ink); text-decoration: none; }
.brand::after { content: ""; display: inline-block; width: .38em; height: .38em; margin-left: .12em; border-radius: 50%; background: var(--accent); vertical-align: .05em; }
#title { color: var(--soft); font-size: 1.05rem; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { font-size: .95rem; padding: .35em .85em; border-radius: 99px; background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(10px); color: var(--soft); font-variant-numeric: tabular-nums; }
.pill:empty { display: none; }
.live { width: 9px; height: 9px; border-radius: 50%; background: #5fd3a0; box-shadow: 0 0 0 4px rgba(95,211,160,.2); }
.live.off { background: #f3a0a0; box-shadow: 0 0 0 4px rgba(243,160,160,.25); }

main { max-width: 820px; margin: 0 auto; padding: 4vh 16px 40vh; }

/* ---------- messages ---------- */
.msg { width: fit-content; max-width: 88%; margin: 14px 0; padding: .65em 1em; border-radius: 1.3em; line-height: 1.25;
  font-size: 1.15rem; white-space: pre-wrap; overflow-wrap: anywhere;
  transition: font-size .5s cubic-bezier(.2,.8,.2,1), opacity .5s, padding .5s;
  animation: pop .7s cubic-bezier(.2,.9,.25,1.15) both; }
.claude { background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border-bottom-left-radius: .35em; box-shadow: 0 14px 40px -18px rgba(123,92,255,.35); }
.me { margin-left: auto; background: linear-gradient(135deg, var(--pink), var(--lilac)); border-bottom-right-radius: .35em; box-shadow: 0 14px 40px -20px rgba(255,120,170,.5); }
.past { opacity: .5; }
.past:hover { opacity: .85; }
.current { font-size: clamp(2rem, 4.6vw, 3.3rem); font-weight: 650; letter-spacing: -.025em; line-height: 1.12; padding: .55em .8em; max-width: 100%; }
.end { font-size: clamp(1.6rem, 3.6vw, 2.4rem); font-weight: 600; letter-spacing: -.02em; }
@keyframes pop { from { opacity: 0; transform: translateY(22px) scale(.96); filter: blur(10px); } }

.typing { color: transparent; }
.typing > * { visibility: hidden; }
.typing, .thinking { position: relative; min-width: 3.2em; min-height: 1.6em; }
.typing::after, .thinking .dots { content: ""; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: .3em; }
.typing::after { content: "• • •"; color: var(--accent); font-size: 1.2rem; letter-spacing: .1em; animation: breathe 1s ease-in-out infinite; }
.thinking { font-size: 1.15rem; color: var(--soft); padding: .7em 1.1em; }
.thinking .dots { position: static; display: inline-flex; margin-right: .6em; vertical-align: middle; }
.thinking .dots i { width: .5em; height: .5em; border-radius: 50%; background: var(--accent); animation: bounce 1.2s ease-in-out infinite; }
.thinking .dots i:nth-child(2) { animation-delay: .15s; background: #ff8fbf; }
.thinking .dots i:nth-child(3) { animation-delay: .3s;  background: #5fc9a8; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-.45em); opacity: 1; } }
@keyframes breathe { 50% { opacity: .35; } }

/* ---------- composer ---------- */
#composer { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(820px, 100%); padding: 0 16px 20px; z-index: 3;
  animation: rise .6s cubic-bezier(.2,.9,.25,1.1) both; }
#composer[hidden] { display: none; }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 30px); } }
.card { background: rgba(255,255,255,.62); border: 1px solid var(--edge); border-radius: 28px; padding: 16px;
  backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5); box-shadow: 0 24px 70px -25px rgba(80,50,160,.4); }
#chips { display: flex; flex-wrap: wrap; gap: 10px; }
#chips:empty { display: none; }
#chips + textarea { margin-top: 12px; }
.chip { font: inherit; font-size: clamp(1.05rem, 2.2vw, 1.35rem); color: var(--ink); padding: .5em 1em; border-radius: 99px; cursor: pointer;
  background: rgba(255,255,255,.75); border: 1.5px solid rgba(123,92,255,.18); transition: transform .15s, background .2s, border-color .2s, box-shadow .2s; }
.chip:hover { transform: translateY(-2px); border-color: rgba(123,92,255,.45); box-shadow: 0 8px 20px -10px rgba(123,92,255,.5); }
.chip[aria-pressed="true"] { background: linear-gradient(135deg, var(--lilac), var(--pink)); border-color: var(--accent); }
.chip .k { display: inline-block; min-width: 1.4em; margin-right: .45em; font-size: .7em; color: var(--soft); font-variant-numeric: tabular-nums; }
.chip .def { margin-left: .5em; font-size: .62em; padding: .15em .55em; border-radius: 99px; background: var(--butter); color: #8a6d00; vertical-align: .15em; }
textarea { display: block; width: 100%; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink);
  font: inherit; font-size: clamp(1.45rem, 3vw, 2.1rem); line-height: 1.25; padding: 6px 8px; max-height: 40vh; }
textarea::placeholder { color: #b9b1cc; }
textarea[hidden] { display: none; }
textarea:focus-visible { outline: 0; }
.row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.hint { flex: 1; color: var(--soft); font-size: .9rem; }
.send { font: inherit; font-weight: 700; font-size: 1.1rem; color: white; border: 0; cursor: pointer; padding: .7em 1.4em; border-radius: 99px;
  background: linear-gradient(135deg, #8f74ff, #ff8fbf); box-shadow: 0 12px 30px -12px rgba(123,92,255,.8); transition: transform .15s, opacity .2s; }
.send:hover { transform: translateY(-2px) scale(1.03); }
.send:disabled { opacity: .45; transform: none; cursor: default; }
.link { font: inherit; background: none; border: 0; color: var(--soft); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: .9rem; }
:focus-visible { outline: 3px solid rgba(123,92,255,.55); outline-offset: 3px; }
.toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: #ffe1e1; color: #8a2d2d; padding: .7em 1.2em; border-radius: 99px; font-size: 1rem; z-index: 9; animation: pop .4s both; }

/* ---------- home ---------- */
.hero { font-size: clamp(3rem, 10vw, 6.5rem); font-weight: 800; letter-spacing: -.06em; margin: 6vh 0 .1em; line-height: .95; }
.sub { font-size: clamp(1.2rem, 2.6vw, 1.6rem); color: var(--soft); margin: 0 0 6vh; }
.threads { display: grid; gap: 14px; }
.thread { display: flex; align-items: center; gap: 16px; text-decoration: none; color: inherit; padding: 20px 24px; border-radius: 24px;
  background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(16px); transition: transform .2s, box-shadow .2s; animation: pop .6s both; }
.thread:hover { transform: translateY(-3px); box-shadow: 0 18px 40px -20px rgba(123,92,255,.5); }
.thread b { flex: 1; font-size: clamp(1.2rem, 2.6vw, 1.6rem); font-weight: 650; letter-spacing: -.02em; }
.thread.closed { opacity: .5; }
.empty { color: var(--soft); font-size: 1.3rem; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div>
  <div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div><div class="bubble b4"></div>
</div>

<header>
  <a class="brand" href="/">jane</a>
  <span id="title"></span>
  <span id="progress" class="pill"></span>
  <span id="live" class="live" title="connected" hidden></span>
</header>

<main id="chat" aria-live="polite"></main>

<form id="composer" hidden>
  <div class="card">
    <div id="chips" role="group" aria-label="options"></div>
    <textarea id="input" rows="1" aria-label="your answer"></textarea>
    <div class="row">
      <span class="hint" id="hint"></span>
      <button type="button" class="link" id="done">close thread</button>
      <button class="send" id="send">send</button>
    </div>
  </div>
</form>

<script>
const $ = s => document.querySelector(s)
const chat = $('#chat'), form = $('#composer'), input = $('#input'), chips = $('#chips'), sendBtn = $('#send')
const tid = location.pathname.match(/^\/t\/([a-f0-9]{8})/)?.[1]

// localStorage: drafts for unanswered questions. Wrapped: private windows throw.
const store = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)) } catch { return null } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} },
  del: k => { try { localStorage.removeItem(k) } catch {} },
}

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg
  document.body.append(t); setTimeout(() => t.remove(), 3500)
}
const fmt = v => Array.isArray(v) ? v.join(', ') : v

// ---------------- home ----------------
async function home() {
  $('#title').textContent = ''
  chat.innerHTML = '<h1 class="hero">hi, it’s jane.</h1><p class="sub">claude’s questions land here, one at a time.</p><div class="threads"></div>'
  const list = chat.querySelector('.threads')
  let threads = []
  try { threads = await (await fetch('/api/threads')).json() } catch { return toast('jane server is not running') }
  if (!threads.length) { list.innerHTML = '<p class="empty">no threads yet — claude will send you a link.</p>'; return }
  threads.sort((a, b) => (a.status === 'open' ? 0 : 1) - (b.status === 'open' ? 0 : 1))
  threads.forEach((t, i) => {
    const a = document.createElement('a')
    a.className = 'thread ' + t.status; a.href = '/t/' + t.id; a.style.animationDelay = i * 60 + 'ms'
    const b = document.createElement('b'); b.textContent = t.title
    const p = document.createElement('span'); p.className = 'pill'
    p.textContent = t.status === 'closed' ? 'closed' : t.pending ? `${t.pending} waiting` : 'claude is thinking'
    a.append(b, p); list.append(a)
  })
}

// ---------------- thread ----------------
let thread = null, current = null, picked = new Set(), firstRender = true
const shown = new Map() // key -> element

function messages(t) {
  const out = []
  for (const q of t.questions) {
    if (!q.answer && t.status !== 'open') break
    out.push({ key: 'q:' + q.id, cls: 'claude', text: q.text, q })
    if (!q.answer) return out // one question at a time
    out.push({ key: 'a:' + q.id, cls: 'me', text: fmt(q.answer.value) })
  }
  if (t.status === 'open') out.push({ key: 'think:' + t.questions.length, cls: 'claude thinking' })
  else out.push({ key: 'end', cls: 'claude end', text: t.note || (t.closedBy === 'user' ? 'you closed this thread.' : 'that’s everything — thank you ✿') })
  return out
}

function render(t) {
  thread = t
  document.title = `jane · ${t.title}`
  $('#title').textContent = t.title
  const answered = t.questions.filter(q => q.answer).length
  $('#progress').textContent = t.questions.length ? `${answered} / ${t.questions.length}` : ''

  const want = messages(t)
  const keys = new Set(want.map(m => m.key))
  for (const [k, el] of shown) if (!keys.has(k)) { el.remove(); shown.delete(k) }
  for (const m of want) {
    if (shown.has(m.key)) continue
    const el = document.createElement('div')
    el.className = 'msg ' + m.cls
    if (m.cls.includes('thinking')) el.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>claude is thinking'
    else el.textContent = m.text
    chat.append(el); shown.set(m.key, el)
    if (m.q && !firstRender) { // fake typing beat before a fresh question appears
      el.classList.add('typing'); setTimeout(() => el.classList.remove('typing'), 700)
    }
  }
  const last = want.at(-1)
  for (const [k, el] of shown) {
    el.classList.toggle('past', k !== last.key)
    el.classList.toggle('current', k === last.key && !!last.q)
  }
  firstRender = false

  const q = last.q || null
  if (q?.id !== current?.id) compose(q)
  if (t.status !== 'open') { store.del('jane:' + t.id) }
  requestAnimationFrame(() => shown.get(last.key).scrollIntoView({ behavior: 'smooth', block: 'center' }))
  if (document.hidden && q) document.title = '● ' + document.title
}

const draftKey = () => `jane:${thread.id}:${current.id}`
function saveDraft() { if (current) store.set(draftKey(), { text: input.value, picked: [...picked] }) }

function compose(q) {
  current = q; picked = new Set()
  form.hidden = !q
  if (!q) return
  const d = store.get(draftKey()) || {}
  picked = new Set((d.picked || []).filter(p => q.options.includes(p)))
  if (!d.picked && q.multi && Array.isArray(q.default)) q.default.forEach(v => picked.add(v))
  chips.innerHTML = ''
  q.options.forEach((o, i) => {
    const b = document.createElement('button')
    b.type = 'button'; b.className = 'chip'; b.dataset.value = o
    const k = document.createElement('span'); k.className = 'k'; k.textContent = i + 1
    b.append(k, o)
    if (q.default === o || (Array.isArray(q.default) && q.default.includes(o))) {
      const s = document.createElement('span'); s.className = 'def'; s.textContent = 'default'; b.append(s)
    }
    b.setAttribute('aria-pressed', picked.has(o))
    b.onclick = () => pick(o)
    chips.append(b)
  })
  input.hidden = !q.other
  input.value = d.text || ''
  input.placeholder = q.options.length ? (q.multi ? 'pick any, or add your own…' : 'pick one, or type your own…') : 'type your answer…'
  if (q.default && !q.multi) input.placeholder = `↵ for “${q.default}”, or type…`
  const keys = q.options.length ? `${q.other ? '⌥' : ''}1–${q.options.length} to pick · ` : ''
  $('#hint').textContent = q.other ? keys + '↵ send · ⇧↵ new line' : (q.multi ? 'pick, then send' : 'pick one')
  grow(); update()
  setTimeout(() => (q.other ? input : chips.firstChild)?.focus({ preventScroll: true }), 750)
}

function pick(o) {
  if (current.multi) {
    picked.has(o) ? picked.delete(o) : picked.add(o)
    chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', picked.has(c.dataset.value)))
    saveDraft(); update()
  } else {
    chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.value === o))
    setTimeout(() => submit(o), 220) // let the pressed state register
  }
}

function value() {
  const text = input.value.trim()
  if (current.multi) return [...picked, ...(text ? [text] : [])]
  return text
}
function update() {
  const v = value()
  sendBtn.disabled = !v.length && !(current.default && current.default.length)
  sendBtn.hidden = !current.multi && !current.other
}
function grow() { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px' }

let busy = false
async function submit(v = value()) {
  if (busy || !current) return
  busy = true; sendBtn.disabled = true
  try {
    const r = await fetch(`/api/threads/${thread.id}/answer`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ qid: current.id, value: v }) })
    if (!r.ok) throw new Error((await r.json()).error)
    store.del(draftKey())
    form.hidden = true // the SSE update renders the answer and next question
  } catch (e) { toast(e.message); update() } finally { busy = false }
}

form.onsubmit = e => { e.preventDefault(); submit() }
input.oninput = () => { grow(); saveDraft(); update() }
input.onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!sendBtn.disabled) submit() }
}
// digits pick options; ⌥+digit while typing (e.code, since ⌥1 on mac is "¡")
document.addEventListener('keydown', e => {
  if (!current || form.hidden || !current.options.length) return
  const n = +(e.code.match(/^(?:Digit|Numpad)(\d)$/)?.[1] ?? 0)
  if (n < 1 || n > current.options.length) return
  if (e.altKey || document.activeElement !== input) { e.preventDefault(); pick(current.options[n - 1]) }
})
$('#done').onclick = async () => {
  if (!confirm('close this thread? claude will get what you answered so far.')) return
  await fetch(`/api/threads/${thread.id}/close`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ by: 'user' }) })
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && thread) document.title = `jane · ${thread.title}` })

function connect() {
  const live = $('#live'); live.hidden = false
  const es = new EventSource(`/api/threads/${tid}/events`)
  es.onmessage = e => { live.classList.remove('off'); render(JSON.parse(e.data)) }
  es.onerror = () => {
    live.classList.add('off')
    if (!thread) fetch(`/api/threads/${tid}`).then(r => { if (r.status === 404) { es.close(); chat.innerHTML = '<p class="empty">no such thread.</p>' } }, () => {})
  }
}

tid ? connect() : home()
</script>
</body>
</html>
