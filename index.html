<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>jane</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23ffcfe3'/><stop offset='1' stop-color='%23a58cff'/></linearGradient></defs><circle cx='16' cy='16' r='14' fill='url(%23g)'/><circle cx='11' cy='10' r='3.5' fill='white' opacity='.8'/></svg>">
<style>
@font-face { font-family: "Instrument Serif"; src: url(/fonts/instrument-serif-latin-400-normal.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "Instrument Serif"; font-style: italic; src: url(/fonts/instrument-serif-latin-400-italic.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "Manrope"; font-weight: 200 800; src: url(/fonts/manrope-latin-wght-normal.woff2) format("woff2"); font-display: swap; }

:root {
  --bg: #09080d; --ink: #f4effc; --soft: #8e87a3; --dim: #5d576e;
  --glass: rgba(255,255,255,.065);
  --lilac: #b8a4ff; --lilac-hi: #ddd3ff; --lilac-lo: #8a72ee;
  --serif: "Instrument Serif", ui-serif, Georgia, serif;
  --sans: "Manrope", ui-sans-serif, system-ui, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100dvh; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
::selection { background: rgba(184,164,255,.35); }

/* ---------- background: slow moving gradient under heavy blur ---------- */
.sky { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.aura { position: absolute; inset: -30%; filter: blur(90px) saturate(1.25); opacity: .62; transition: opacity 2s var(--ease), filter 1.6s var(--ease);
  background:
    radial-gradient(28% 34% at 22% 28%, var(--lilac), transparent 70%),
    radial-gradient(26% 30% at 78% 22%, var(--lilac-hi), transparent 70%),
    radial-gradient(30% 32% at 30% 78%, var(--lilac-lo), transparent 70%),
    radial-gradient(24% 28% at 76% 74%, var(--lilac-hi), transparent 70%);
  animation: swirl 48s ease-in-out infinite alternate; }
.aura.two { opacity: .42; mix-blend-mode: screen; animation: swirl2 63s ease-in-out infinite alternate;
  background:
    radial-gradient(30% 30% at 60% 40%, var(--lilac-lo), transparent 70%),
    radial-gradient(22% 26% at 35% 55%, var(--lilac-hi), transparent 70%),
    radial-gradient(26% 24% at 70% 85%, var(--lilac), transparent 70%); }
@keyframes swirl  { 33% { transform: rotate(40deg) scale(1.15) translate(4%, -3%); } 66% { transform: rotate(-25deg) scale(.95) translate(-5%, 4%); } 100% { transform: rotate(80deg) scale(1.1) translate(3%, 5%); } }
@keyframes swirl2 { 50% { transform: rotate(-60deg) scale(1.2) translate(-4%, -4%); } 100% { transform: rotate(30deg) scale(1) translate(5%, 2%); } }
.veil { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 45%, rgba(9,8,13,.3), rgba(9,8,13,.78)); }
.grain { position: absolute; inset: 0; opacity: .07; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
body.is-thinking .aura { opacity: .85; }
body.is-thinking .aura.two { opacity: .6; }
body.is-pulse .aura { filter: blur(70px) saturate(1.6) brightness(1.4); transition: filter .25s; }

/* ---------- header ---------- */
header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 14px; padding: 20px clamp(16px, 4vw, 40px);
  isolation: isolate; }
/* frosted header: blurs what scrolls under it, fading out at the bottom edge */
header::before { content: ""; position: absolute; z-index: -1; inset: 0 0 -24px 0;
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
.brand { font-family: var(--serif); font-style: italic; font-size: 2rem; line-height: 1; color: var(--ink); text-decoration: none; transition: letter-spacing .4s var(--ease); }
.brand:hover { letter-spacing: .04em; }
.brand::after { content: ""; display: inline-block; width: .22em; height: .22em; margin-left: .1em; border-radius: 50%; background: var(--lilac-hi); animation: glow 3s ease-in-out infinite; }
@keyframes glow { 50% { background: var(--lilac); } }
#title { color: var(--soft); font-size: .98rem; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { font-size: .85rem; font-weight: 600; padding: .4em .9em; border-radius: 99px; background: var(--glass); color: var(--soft); font-variant-numeric: tabular-nums; }
.pill:empty { display: none; }
#progress { font-size: .85rem; color: var(--dim); font-variant-numeric: tabular-nums; }
#bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: linear-gradient(90deg, var(--lilac), var(--lilac-hi), var(--lilac-hi)); transition: width .9s var(--ease); }

main { max-width: 860px; margin: 0 auto; padding: 4vh 16px max(42vh, calc(var(--composer-h, 0px) + 10vh)); }
.current { scroll-margin: 90px 0 calc(var(--composer-h, 0px) + 28px); }

/* ---------- messages ---------- */
.msg { width: fit-content; max-width: 86%; margin: 14px 0; padding: .6em 1em; border-radius: 1.2em; line-height: 1.3;
  font-size: 1.05rem; white-space: pre-wrap; overflow-wrap: anywhere;
  transition: font-size .6s var(--ease), opacity .6s, padding .6s var(--ease), background .6s;
  animation: pop .8s var(--ease) both; }
.claude { background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-bottom-left-radius: .3em; }
.me { margin-left: auto; color: #1a1426; font-weight: 600; background: linear-gradient(135deg, var(--lilac), var(--lilac-hi)); border-bottom-right-radius: .3em;
  animation: fly .7s var(--ease) both; }
.past { opacity: .42; }
.past:hover { opacity: .8; }
.current { font-family: var(--serif); font-size: calc(clamp(2.5rem, 6vw, 4.4rem) * var(--s, 1)); line-height: 1.04; letter-spacing: -.01em;
  max-width: 100%; padding: .1em 0 .2em; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; margin: 4vh 0 2vh; }
.end { font-family: var(--serif); font-style: italic; font-size: calc(clamp(2rem, 4.6vw, 3.2rem) * var(--s, 1)); line-height: 1.1; background: transparent; padding-left: 0; }
.ctx { font-family: var(--sans); font-size: clamp(1rem, 1.7vw, 1.2rem); line-height: 1.55; letter-spacing: 0; color: var(--soft);
  max-width: 44em; margin-bottom: 1em; animation: pop .8s var(--ease) both; }
.past .ctx { display: none; }
.typing .ctx { visibility: hidden; }
.w { display: inline-block; animation: word .9s var(--ease) both; animation-delay: calc(var(--i) * 38ms); }
@keyframes word { from { opacity: 0; transform: translateY(.4em) rotate(2deg); filter: blur(10px); } }
@keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.97); filter: blur(10px); } }
@keyframes fly { from { opacity: 0; transform: translate(40px, 10px) scale(.9); filter: blur(6px); } }

.typing { position: relative; min-width: 3.4em; min-height: 1.2em; }
.typing .w { animation: none; opacity: 0; }
.typing::after { content: "• • •"; position: absolute; left: 0; top: .5em; font-family: var(--sans); font-size: 1.3rem; color: var(--lilac); animation: breathe 1s ease-in-out infinite; }
.thinking { display: flex; align-items: center; gap: .7em; color: var(--soft); padding: .75em 1.1em; }
.thinking .dots { display: inline-flex; gap: .3em; }
.thinking .dots i { width: .48em; height: .48em; border-radius: 50%; background: var(--lilac); animation: bounce 1.3s var(--ease) infinite; }
.thinking .dots i:nth-child(2) { animation-delay: .15s; background: var(--lilac-hi); }
.thinking .dots i:nth-child(3) { animation-delay: .3s; background: var(--lilac-lo); }
.shimmer { background: linear-gradient(90deg, var(--dim), var(--ink), var(--dim)); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2.2s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-.5em); opacity: 1; } }
@keyframes breathe { 50% { opacity: .35; } }

/* ---------- composer ---------- */
#composer { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(860px, 100%); padding: 0 16px 22px; z-index: 3;
  animation: rise .8s var(--ease) backwards; } /* no fill: a lingering filter would disable the backdrop blur */
#composer[hidden] { display: none; }
/* frosted band behind the composer so long text scrolling underneath blurs out instead of showing through */
#composer::before { content: ""; position: absolute; z-index: -1; left: 50%; top: -90px; bottom: 0; width: 100vw; transform: translateX(-50%);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  -webkit-mask-image: linear-gradient(transparent, #000 90px); mask-image: linear-gradient(transparent, #000 90px); }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 40px); } }
.card { position: relative; /* no fill: blur only */ border-radius: 26px; padding: 16px;
  backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); }
#chips { display: flex; flex-wrap: wrap; gap: 10px; }
#chips:empty { display: none; }
#chips + textarea { margin-top: 12px; }
.chip { font: inherit; border: 0; font-weight: 600; font-size: clamp(1rem, 2vw, 1.2rem); color: var(--ink); padding: .55em 1.05em; border-radius: 99px; cursor: pointer;
  background: rgba(255,255,255,.07); animation: pop .6s var(--ease) both; animation-delay: calc(var(--i) * 60ms + 250ms);
  transition: transform .2s var(--ease), background .2s, color .2s; }
.chip:hover { background: rgba(184,164,255,.2); }
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] { color: #1a1426; background: var(--lilac); }
.chip .k { display: inline-block; min-width: 1.3em; margin-right: .4em; font-size: .72em; opacity: .5; font-variant-numeric: tabular-nums; }
.chip .def { margin-left: .5em; font-size: .62em; padding: .2em .6em; border-radius: 99px; background: rgba(184,164,255,.16); color: var(--lilac-hi); vertical-align: .15em; }
.chip[aria-pressed="true"] .def { background: rgba(26,20,38,.15); color: #1a1426; }
textarea { display: block; width: 100%; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink); caret-color: var(--lilac-hi);
  font-family: var(--serif); font-size: clamp(1.7rem, 3.4vw, 2.4rem); line-height: 1.2; padding: 6px 8px; max-height: 40vh; }
textarea::placeholder { color: var(--dim); font-style: italic; }
textarea[hidden] { display: none; }
textarea:focus-visible { outline: 0; }
.row { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
.hint { flex: 1; color: var(--dim); font-size: .82rem; }
.send { font: inherit; font-weight: 700; font-size: 1rem; color: #1a1426; border: 0; cursor: pointer; padding: .75em 1.5em; border-radius: 99px;
  background: var(--lilac); transition: transform .2s var(--ease), opacity .3s, background .2s; }
.send:hover { background: var(--lilac-hi); }
.send:active { transform: scale(.95); }
.send:disabled { opacity: .3; transform: none; cursor: default; }
.link { font: inherit; background: none; border: 0; color: var(--dim); cursor: pointer; font-size: .82rem; transition: color .2s; }
.link:hover { color: var(--lilac-hi); }
:focus-visible { outline: 2px solid var(--lilac); outline-offset: 3px; }
.toast { position: fixed; top: 84px; left: 50%; transform: translateX(-50%); background: rgba(255,122,138,.14);
  backdrop-filter: blur(14px); color: #ffc2ca; padding: .7em 1.2em; border-radius: 99px; font-size: .95rem; z-index: 9; animation: pop .4s var(--ease) both; }

/* ---------- home ---------- */
.hero { font-family: var(--serif); font-weight: 400; font-size: clamp(4rem, 13vw, 9rem); letter-spacing: -.02em; margin: 5vh 0 0; line-height: .9; }
.hero em { background: linear-gradient(100deg, var(--lilac), var(--lilac-hi), var(--lilac-hi), var(--lilac-lo), var(--lilac)); background-size: 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 8s linear infinite; padding-right: .08em; }
.sub { font-size: clamp(1.05rem, 2.2vw, 1.35rem); color: var(--soft); margin: .8em 0 6vh; animation: pop .9s var(--ease) .3s both; }
.threads { display: grid; gap: 12px; }
.thread { display: flex; align-items: center; gap: 16px; text-decoration: none; color: inherit; padding: 20px 24px; border-radius: 22px;
  background: var(--glass); backdrop-filter: blur(18px); animation: pop .7s var(--ease) both;
  transition: background .2s; }
.thread:hover { background: rgba(184,164,255,.12); }
.thread b { flex: 1; font-family: var(--serif); font-weight: 400; font-size: clamp(1.5rem, 3vw, 2rem); line-height: 1.1; }
.empty { color: var(--soft); font-size: 1.2rem; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="aura"></div><div class="aura two"></div><div class="veil"></div><div class="grain"></div></div>

<header>
  <a class="brand" href="/">jane</a>
  <span id="title"></span>
  <span id="progress"></span>
  <span id="bar"></span>
</header>

<main id="chat" aria-live="polite"></main>

<form id="composer" hidden>
  <div class="card">
    <div id="chips" role="group" aria-label="options"></div>
    <textarea id="input" rows="1" aria-label="your answer"></textarea>
    <div class="row">
      <span class="hint" id="hint"></span>
      <button type="button" class="link" id="done">close thread</button>
      <button class="send" id="send">send</button>
    </div>
  </div>
</form>

<script>
const $ = s => document.querySelector(s)
const chat = $('#chat'), form = $('#composer'), input = $('#input'), chips = $('#chips'), sendBtn = $('#send')
const tid = location.pathname.match(/^\/t\/([a-f0-9]{8})/)?.[1]

// localStorage: drafts for unanswered questions. Wrapped: private windows throw.
const store = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)) } catch { return null } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} },
  del: k => { try { localStorage.removeItem(k) } catch {} },
}

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg
  document.body.append(t); setTimeout(() => t.remove(), 3500)
}
const fmt = v => Array.isArray(v) ? v.join(', ') : v
// word-by-word blur-in; whitespace stays as text so wrapping and newlines still work
function words(el, text) {
  let i = 0
  for (const part of text.split(/(\s+)/)) {
    if (!part) continue
    if (/^\s+$/.test(part)) { el.append(part); continue }
    const w = document.createElement('span'); w.className = 'w'; w.style.setProperty('--i', i++); w.textContent = part
    el.append(w)
  }
}

// ---------------- home ----------------
async function home() {
  $('#title').textContent = ''
  chat.innerHTML = '<h1 class="hero">hi, it’s <em>jane</em>.</h1><p class="sub">claude’s questions land here, one at a time.</p><div class="threads"></div>'
  const list = chat.querySelector('.threads')
  let threads = []
  try { threads = (await (await fetch('/api/threads')).json()).filter(t => t.status === 'open') } catch { return toast('jane server is not running') }
  if (!threads.length) { list.innerHTML = '<p class="empty">no open threads — claude will send you a link.</p>'; return }
  threads.forEach((t, i) => {
    const a = document.createElement('a')
    a.className = 'thread ' + t.status; a.href = '/t/' + t.id; a.style.animationDelay = i * 60 + 'ms'
    const b = document.createElement('b'); b.textContent = t.title
    const p = document.createElement('span'); p.className = 'pill'
    p.textContent = t.pending ? `${t.pending} waiting` : 'claude is thinking'
    a.append(b, p); list.append(a)
  })
}

// ---------------- thread ----------------
let thread = null, current = null, picked = new Set(), firstRender = true
const shown = new Map() // key -> element

function messages(t) {
  const out = []
  for (const q of t.questions) {
    if (!q.answer && t.status !== 'open') break
    out.push({ key: 'q:' + q.id, cls: 'claude', text: q.text, q })
    if (!q.answer) return out // one question at a time
    out.push({ key: 'a:' + q.id, cls: 'me', text: fmt(q.answer.value) })
  }
  if (t.status === 'open') out.push({ key: 'think:' + t.questions.length, cls: 'claude thinking' })
  else out.push({ key: 'end', cls: 'claude end', text: t.note || (t.closedBy === 'user' ? 'you closed this thread.' : 'that’s everything — thank you ✿') })
  return out
}

function render(t) {
  thread = t
  document.title = `jane · ${t.title}`
  $('#title').textContent = t.title
  const answered = t.questions.filter(q => q.answer).length
  $('#progress').textContent = t.questions.length ? `${answered} / ${t.questions.length}` : ''
  $('#bar').style.width = t.questions.length ? (answered / t.questions.length) * 100 + '%' : '0'
  document.body.classList.toggle('is-thinking', t.status === 'open' && t.questions.every(q => q.answer))

  const want = messages(t)
  const keys = new Set(want.map(m => m.key))
  for (const [k, el] of shown) if (!keys.has(k)) { el.remove(); shown.delete(k) }
  for (const m of want) {
    if (shown.has(m.key)) continue
    const el = document.createElement('div')
    el.className = 'msg ' + m.cls
    if (m.cls.includes('thinking')) el.innerHTML = '<span class="dots"><i></i><i></i><i></i></span><span class="shimmer">claude is thinking</span>'
    else if ((m.q && !m.q.answer) || m.key === 'end') {
      if (m.q?.context) { const c = document.createElement('div'); c.className = 'ctx'; c.textContent = m.q.context; el.append(c) }
      // longer text, smaller type: full size up to ~60 chars, down to 55% around 240+
      el.style.setProperty('--s', Math.max(.55, Math.min(1, 1.15 - m.text.length / 400)))
      words(el, m.text)
    }
    else el.textContent = m.text
    chat.append(el); shown.set(m.key, el)
    if (m.q && !firstRender) { // fake typing beat before a fresh question appears
      el.classList.add('typing'); setTimeout(() => el.classList.remove('typing'), 700)
    }
  }
  const last = want.at(-1)
  for (const [k, el] of shown) {
    el.classList.toggle('past', k !== last.key)
    el.classList.toggle('current', k === last.key && !!last.q)
  }
  firstRender = false

  const q = last.q || null
  if (q?.id !== current?.id) compose(q)
  if (t.status !== 'open') { store.del('jane:' + t.id) }
  requestAnimationFrame(() => {
    syncComposer() // the ResizeObserver fires after this frame; scroll needs the height now
    // a question sits right above the composer (scroll-margin-bottom); long context may scroll up under the header
    shown.get(last.key).scrollIntoView({ behavior: 'smooth', block: last.q ? 'end' : 'center' })
  })
  if (document.hidden && q) document.title = '● ' + document.title
}

const draftKey = () => `jane:${thread.id}:${current.id}`
function saveDraft() { if (current) store.set(draftKey(), { text: input.value, picked: [...picked] }) }

function compose(q) {
  current = q; picked = new Set()
  form.hidden = !q
  if (!q) return
  const d = store.get(draftKey()) || {}
  picked = new Set((d.picked || []).filter(p => q.options.includes(p)))
  if (!d.picked && q.multi && Array.isArray(q.default)) q.default.forEach(v => picked.add(v))
  chips.innerHTML = ''
  q.options.forEach((o, i) => {
    const b = document.createElement('button')
    b.type = 'button'; b.className = 'chip'; b.dataset.value = o
    const k = document.createElement('span'); k.className = 'k'; k.textContent = i + 1
    b.append(k, o)
    if (q.default === o || (Array.isArray(q.default) && q.default.includes(o))) {
      const s = document.createElement('span'); s.className = 'def'; s.textContent = 'default'; b.append(s)
    }
    b.setAttribute('aria-pressed', picked.has(o))
    b.style.setProperty('--i', i)
    b.onclick = () => pick(o)
    chips.append(b)
  })
  input.hidden = !q.other
  input.value = d.text || ''
  input.placeholder = q.options.length ? (q.multi ? 'pick any, or add your own…' : 'pick one, or type your own…') : 'type your answer…'
  if (q.default && !q.multi) input.placeholder = `↵ for “${q.default}”, or type…`
  const keys = q.options.length ? `${q.other ? '⌥' : ''}1–${q.options.length} to pick · ` : ''
  $('#hint').textContent = q.other ? keys + '↵ send · ⇧↵ new line' : (q.multi ? 'pick, then send' : 'pick one')
  grow(); update()
  setTimeout(() => (q.other ? input : chips.firstChild)?.focus({ preventScroll: true }), 750)
}

function pick(o) {
  if (current.multi) {
    picked.has(o) ? picked.delete(o) : picked.add(o)
    chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', picked.has(c.dataset.value)))
    saveDraft(); update()
  } else {
    chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.value === o))
    setTimeout(() => submit(o), 220) // let the pressed state register
  }
}

function value() {
  const text = input.value.trim()
  if (current.multi) return [...picked, ...(text ? [text] : [])]
  return text
}
function update() {
  const v = value()
  sendBtn.disabled = !v.length && !(current.default && current.default.length)
  sendBtn.hidden = !current.multi && !current.other
}
function grow() { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px' }

let busy = false
async function submit(v = value()) {
  if (busy || !current) return
  // capture: the SSE update can render the next question before this fetch resolves
  const q = current, key = draftKey()
  busy = true; form.hidden = true // the SSE update brings the answer and the next question
  try {
    const r = await fetch(`/api/threads/${thread.id}/answer`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ qid: q.id, value: v }) })
    if (!r.ok) throw new Error((await r.json()).error)
    store.del(key)
    document.body.classList.add('is-pulse'); setTimeout(() => document.body.classList.remove('is-pulse'), 450)
  } catch (e) { toast(e.message); if (current === q) { form.hidden = false; update() } } finally { busy = false }
}

const syncComposer = () => document.documentElement.style.setProperty('--composer-h', form.offsetHeight + 'px')
new ResizeObserver(syncComposer).observe(form)
form.onsubmit = e => { e.preventDefault(); submit() }
input.oninput = () => { grow(); saveDraft(); update() }
input.onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!sendBtn.disabled) submit() }
}
// digits pick options; ⌥+digit while typing (e.code, since ⌥1 on mac is "¡")
document.addEventListener('keydown', e => {
  if (!current || form.hidden || !current.options.length) return
  const n = +(e.code.match(/^(?:Digit|Numpad)(\d)$/)?.[1] ?? 0)
  if (n < 1 || n > current.options.length) return
  if (e.altKey || document.activeElement !== input) { e.preventDefault(); pick(current.options[n - 1]) }
})
$('#done').onclick = async () => {
  if (!confirm('close this thread? claude will get what you answered so far.')) return
  await fetch(`/api/threads/${thread.id}/close`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ by: 'user' }) })
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && thread) document.title = `jane · ${thread.title}` })

function connect() {
  const es = new EventSource(`/api/threads/${tid}/events`)
  es.onmessage = e => render(JSON.parse(e.data))
  es.onerror = () => {
    if (!thread) fetch(`/api/threads/${tid}`).then(r => { if (r.status === 404) { es.close(); chat.innerHTML = '<p class="empty">no such thread.</p>' } }, () => {})
  }
}

tid ? connect() : home()
</script>
</body>
</html>
